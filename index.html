</style></head><body><div class="app"><div id="app"></div></div><script>
const KEY='tes-study-prototype-v3'; // 로컬 시연 데이터 전용: 운영 시 서버 인증으로 교체
const pad=n=>String(n).padStart(2,'0');
const localDate=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>localDate();
const addDays=(date,n)=>{let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)};
const monday=(date)=>{let d=new Date(date+'T12:00:00');return addDays(date,-((d.getDay()+6)%7))};
const fmt=d=>d?`${Number(d.slice(5,7))}/${Number(d.slice(8,10))}`:'';
const sample={students:[{id:'s1',name:'김민준',school:'하계중',grade:'2',accessCode:'',product:'일반 몰입석 관리형',start:today(),end:addDays(today(),27)}],plans:{s1:[{id:'p1',date:today(),subject:'영어',book:'영어 교과서',range:'3과',goal:'본문 5회독 · 백지 테스트',done:false}]},tasks:{s1:[{id:'t1',date:today(),createdAt:Date.now()-60000,source:'학교',subject:'수학',detail:'문제집 42~45쪽',studentDone:false,staffStatus:'대기'},{id:'t2',date:today(),createdAt:Date.now(),source:'학원',subject:'영어',detail:'단어 3과 암기',studentDone:true,staffStatus:'대기'}]},requests:{s1:[]},reviews:{s1:[]}};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(sample)}catch{db=structuredClone(sample)};
// 시연용 브라우저 저장. 실서비스에서는 서버에서 비밀번호 생성·해시 저장·검증해야 함.
const randomSix=()=>{const a=new Uint32Array(1);let n;do{crypto.getRandomValues(a);n=a[0]}while(n>=4294000000);return String(100000+(n%900000))};
function newCode(){let code;do{code=randomSix()}while(db.students.some(s=>s.accessCode===code));return code}
for(const s of db.students){if(!s.accessCode)s.accessCode=newCode()}
localStorage.setItem(KEY,JSON.stringify(db));
let staffPin=localStorage.getItem('tes-study-staff-pin-demo')||'1234';
// 임시 로컬 시연 번호. 실제 서비스에서는 Supabase 서버 측에서 검증.
const securityPin='654321';
let state={role:'',id:'',tab:'',auth:false,loginPin:'',calStart:monday(today()),selectedDate:today(),taskDate:today(),editPlan:null,regMode:false,modal:null,fridayEdit:null,inspectFilter:'pending',inspectSearch:'',expandedStudent:'',registrySearch:'',registryFilter:'active',registrySort:'name',expandedRegistry:'',studentTaskDate:today(),securityStep:'verify',securityVerified:false};
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const student=()=>db.students.find(s=>s.id===state.id);
const isActive=s=>s.status!=='stopped'&&(!s.start||!s.end||(today()>=s.start&&today()<=s.end));
const studentStatus=s=>s.status==='stopped'?'stopped':isActive(s)?'active':'expired';
const sethtml=h=>$('app').innerHTML=h;
const go=role=>{state.role=role;state.id=role==='staff'?(db.students[0]?.id||''):'';state.tab='';state.auth=false;state.loginPin='';state.regMode=false;state.securityVerified=false;state.securityStep='verify';render()};
const back=()=>{state.role='';state.auth=false;state.regMode=false;state.securityVerified=false;state.securityStep='verify';render()};
function gate(){sethtml(`<div class="brand"><small>TES STUDY CAFE</small><h1>STUDY MANAGER</h1><p>스스로 계획하고 실천하는 학습관리</p></div><div class="panel"><div class="buttons"><button onclick="go('student')">🎓 학생</button><button class="secondary" onclick="go('parent')">👨‍👩‍👧 학부모</button></div></div><button class="ghost adminlink" onclick="go('staff')">⚙ 스태프 관리자 페이지 이동</button>`)}
function login(){sethtml(`<div class="top"><h2>${{student:'학생',parent:'학부모',staff:'관리자'}[state.role]} 접속</h2><button class="ghost" onclick="back()">처음으로</button></div><div class="panel"><label>${state.role==='staff'?'관리자 비밀번호':'학생별 접속번호 6자리'}</label><input id="pin" type="password" inputmode="numeric" maxlength="${state.role==='staff'?4:6}" placeholder="${state.role==='staff'?'4자리 숫자':'6자리 숫자'}" onkeydown="if(event.key==='Enter')auth()"><button onclick="auth()" style="width:100%">접속하기</button><p id="err" class="error small"></p></div>`)}
function auth(){let pin=$('pin').value;if(state.role==='staff'?pin!==staffPin:!db.students.some(s=>s.accessCode===pin)){$('err').textContent='비밀번호를 확인해 주세요.';return}state.loginPin=pin;state.auth=true;state.id=state.role==='staff'?state.id:eligible()[0]?.id||'';state.tab='';render()}
function eligible(){return db.students.filter(s=>s.accessCode===state.loginPin)}
function pickStudent(id){state.id=id;state.tab='';state.calStart=monday(today());state.selectedDate=today();state.editPlan=null;render()}
function selection(){let list=eligible();return `<div class="top"><h2>${state.role==='parent'?'학부모':'학생'} · 학생 선택</h2><button class="ghost" onclick="back()">처음으로</button></div><div class="panel"><p class="small muted">번호에 연결된 학생을 선택하세요. 형제자매는 이름이 각각 표시됩니다.</p>${list.map(s=>`<button class="selectstudent" onclick="pickStudent('${s.id}')">${esc(s.name)} <span class="tag">${esc(s.school)} · ${esc(s.grade)}학년</span></button>`).join('')||'<p>등록된 학생이 없습니다. 스태프에게 문의하세요.</p>'}</div>`}
function header(){return `<div class="manager-header"><h1 class="manager-title">TES <span style="color:#3159a5">Study Manager</span></h1><div class="manager-meta"><span class="tag">${{student:'학생',parent:'학부모',staff:'관리자'}[state.role]} 화면</span><button class="ghost" onclick="back()">나가기</button></div></div>${state.role==='staff'?'':`<div class="panel"><b>${esc(student().name)}</b> <span class="muted small">${esc(student().school)} · ${esc(student().grade)}학년</span></div>`}`}

function tabs(names){if(!state.tab)state.tab=names[0][0];return `<div class="nav ${state.role==='staff'?'staff-nav':''}">${names.map(([id,label])=>`<button class="${state.tab===id?'':'secondary'}" onclick="state.tab='${id}';state.modal=null;render()">${label}</button>`).join('')}</div>`}
function expiry(){return `<div class="panel" style="text-align:center;padding:35px 15px"><h2>관리형 이용 기간이 종료되었습니다.</h2><p>${esc(student().name)} 학생의 이용 기간: ${esc(student().start)} ~ ${esc(student().end)}</p><p>재결제 후 스태프에게 기간 연장을 요청해 주세요.</p><button class="secondary" onclick="back()">처음으로</button></div>`}
function calendar(){
 const start=state.calStart,selected=state.selectedDate,ps=db.plans[state.id]||[],reviews=db.reviews[state.id]||[];
 let h=`<div class="panel"><h2>학습플래너</h2><p class="small muted">28일 전체를 보며 날짜를 터치해 학습계획을 확인합니다.</p><div class="datebar"><button class="secondary inlinebtn" onclick="moveCalendar(-28)">‹ 이전 4주</button><b>${fmt(start)} ~ ${fmt(addDays(start,27))}</b><button class="secondary inlinebtn" onclick="moveCalendar(28)">다음 4주 ›</button></div><div class="calendar" style="margin-top:15px">${['월','화','수','목','금','토','일'].map(x=>`<div class="dayhead">${x}</div>`).join('')}`;
 for(let i=0;i<28;i++){
  const date=addDays(start,i),dayPlans=ps.filter(p=>p.date===date);
  h+=`<button class="day ${date===selected?'active':''} ${i%7===4?'friday':''}" onclick="selectDate('${date}')"><strong>${fmt(date)}</strong>${dayPlans.slice(0,3).map(p=>`<span class="mini">${esc(p.subject)} · ${esc(p.range)}</span>`).join('')}${dayPlans.length>3?`<span class="mini">+${dayPlans.length-3}개</span>`:''}</button>`;
  if(i%7===6){const fri=addDays(start,i-2),note=reviews.filter(r=>r.friday===fri).slice(-1)[0];h+=`<div class="weeknote" ${state.role==='staff'?`role="button" tabindex="0" onclick="selectFriday('${fri}')" onkeydown="if(event.key==='Enter')selectFriday('${fri}')"`:''}><b>${Math.floor(i/7)+1}주 차 금요일 점검 · ${fmt(fri)} ${state.role==='staff'?'✎':''}</b>${weekPlanSummary(fri,ps)}<p>${note?esc(note.note):'아직 작성된 점검 코멘트가 없습니다.'}</p>${state.role==='staff'?`<button type="button" class="review-action" onclick="event.stopPropagation();selectFriday('${fri}')">✎ 코멘트 작성·수정</button>`:''}</div>`}
 }
 h+='</div></div>';
 if(state.modal==='date'){
  const dayPlans=ps.filter(p=>p.date===selected),edit=ps.find(p=>p.id===state.editPlan),previous=ps.filter(p=>p.date<selected).sort((a,b)=>b.date.localeCompare(a.date));
  h+=`<div class="modal-backdrop" onclick="closeModal(event)"><section class="dialog" role="dialog" aria-modal="true" aria-label="날짜별 학습계획"><div class="dialog-head"><div><span class="tag">학습플래너</span><h2>${esc(selected)} 학습계획</h2></div><button class="ghost closebtn" onclick="dismissModal()" aria-label="닫기">✕</button></div><div class="dialog-body">${dayPlans.map(p=>`<div class="compact-plan"><div><b>${esc(p.subject)}</b> · ${esc(p.book)}<div class="small muted">${esc(p.range)} · ${esc(p.goal)}</div></div><div class="compact-actions">${state.role==='student'?`<button class="secondary inlinebtn" onclick="editPlan('${p.id}')">수정</button><label class="small inline-check"><input type="checkbox" class="check" ${p.done?'checked':''} onchange="planDone('${p.id}',this.checked)"> 완료</label><span class="pill">${esc(p.staffStatus&&p.staffStatus!=='미확인'?p.staffStatus:'대기')}</span>`:state.role==='staff'?`<label class="small inline-check"><input type="checkbox" class="check" ${p.done?'checked':''} disabled> 학생 완료</label><select class="staff-review-select" aria-label="선생님 확인 결과" onchange="planStaffCheck('${p.id}',this.value)"><option value="미확인" ${!p.staffStatus||p.staffStatus==='미확인'||p.staffStatus==='대기'?'selected':''}>대기</option><option value="완료 확인" ${p.staffStatus==='완료 확인'?'selected':''}>완료 확인</option><option value="미완료 확인" ${p.staffStatus==='미완료 확인'?'selected':''}>미완료 확인</option></select>`:`<span class="pill">학생 ${p.done?'완료':'미완료'}</span><span class="pill">${esc(p.staffStatus&&p.staffStatus!=='미확인'?p.staffStatus:'대기')}</span>`}</div></div>`).join('')||'<p class="small muted">이 날짜에 등록된 계획이 없습니다.</p>'}`;
  if(state.role==='student')h+=`<div class="form-divider"><h3>${edit?'학습계획 수정':'학습계획 추가'}</h3><div class="row"><button class="secondary inlinebtn" onclick="copyPrevious()">이전 계획 불러오기</button>${previous.length?`<span class="tag">최근 작성일 ${previous[0].date}</span>`:''}</div><div class="plan-entry-fields"><div><label>과목</label><input id="ps" value="${esc(edit?.subject||'')}" placeholder="예: 수학"></div><div><label>교재</label><input id="pb" value="${esc(edit?.book||'')}" placeholder="예: 수학 교과서"></div></div><label>학습 범위</label><input id="pr" value="${esc(edit?.range||'')}" placeholder="예: 3단원"><label>학습 내용</label><input id="pg" value="${esc(edit?.goal||'')}" placeholder="예: 5회독 · 백지 테스트"><button class="fullbtn" onclick="savePlan()">${edit?'수정 저장':'계획 저장'}</button></div>`;
  h+='</div></section></div>';
 }
 if(state.modal==='review'&&state.role==='staff'){
  const fri=state.fridayEdit,r=reviews.filter(x=>x.friday===fri).slice(-1)[0];
  h+=`<div class="modal-backdrop" onclick="closeModal(event)"><section class="dialog" role="dialog" aria-modal="true" aria-label="금요일 점검 코멘트"><div class="dialog-head"><h2>${fmt(fri)} 금요일 점검</h2><button class="ghost closebtn" onclick="dismissModal()">✕</button></div><div class="dialog-body">${weekPlanSummary(fri,ps)}<label>이번 주 진행 상황과 다음 주 조정사항</label><textarea id="review" rows="5" placeholder="예: 수학 진도가 늦어져 다음 주 학습량을 조정함">${esc(r?.note||'')}</textarea><button class="fullbtn" onclick="saveReview()">코멘트 저장</button></div></section></div>`;
 }
 return h;
}
function selectDate(d){state.selectedDate=d;state.editPlan=null;state.modal='date';render()}
function moveCalendar(n){state.calStart=addDays(state.calStart,n);state.selectedDate=state.calStart;state.fridayEdit=null;state.modal=null;render()}
function editPlan(id){state.editPlan=id;state.modal='date';render()}
function copyPrevious(){let ps=(db.plans[state.id]||[]).filter(p=>p.date<state.selectedDate).sort((a,b)=>b.date.localeCompare(a.date));if(!ps.length)return alert('이전 계획이 없습니다.');let prev=ps[0];$('ps').value=prev.subject;$('pb').value=prev.book;$('pr').value=prev.range;$('pg').value=prev.goal}
function savePlan(){let subject=$('ps').value.trim(),book=$('pb').value.trim(),range=$('pr').value.trim(),goal=$('pg').value.trim();if(!subject||!range)return alert('과목과 범위를 입력해 주세요.');let ps=db.plans[state.id]??=[];if(state.editPlan){let p=ps.find(x=>x.id===state.editPlan);Object.assign(p,{subject,book,range,goal,staffStatus:'미확인'})}else ps.push({id:uid(),date:state.selectedDate,subject,book,range,goal,done:false});state.editPlan=null;save();state.modal='date';render()}
function planDone(id,v){let p=db.plans[state.id].find(x=>x.id===id);p.done=v;p.staffStatus='미확인';save();render()}
function planStaffCheck(id,status){let p=db.plans[state.id].find(x=>x.id===id);if(!p)return;p.staffStatus=status;save();render()}
function weekPlanSummary(fri,ps){const start=addDays(fri,-4),end=addDays(fri,2),items=ps.filter(p=>p.date>=start&&p.date<=end);const done=items.filter(p=>p.staffStatus==='완료 확인').length,notDone=items.filter(p=>p.staffStatus==='미완료 확인').length,unchecked=items.length-done-notDone;return `<div class="statbar"><span class="status">이번 주 계획 ${items.length}개</span><span class="status">완료 ${done}개</span><span class="status">미완료 ${notDone}개</span></div>`} 
function selectFriday(d){state.fridayEdit=d;state.modal='review';render()}
function saveReview(){let note=$('review').value.trim();if(!note)return;let rs=db.reviews[state.id]??=[];let old=rs.findLast?.(r=>r.friday===state.fridayEdit)||rs.filter(r=>r.friday===state.fridayEdit).slice(-1)[0];if(old)old.note=note;else rs.push({id:uid(),friday:state.fridayEdit,date:today(),note});state.fridayEdit=null;state.modal=null;save();render()}
function dismissModal(){state.modal=null;state.editPlan=null;render()}
function closeModal(e){if(e.target.classList.contains('modal-backdrop'))dismissModal()}
function tasks(){
 const d=state.studentTaskDate||today();
 const list=(db.tasks[state.id]||[]).filter(t=>t.date===d).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 return `<div class="panel"><div class="compact-title"><div><h2>매일 학교·학원 과제</h2><p class="small muted">학생 완료 표시와 스태프 확인 결과는 구분됩니다.</p></div>${state.role==='student'&&d===today()?`<button class="inlinebtn" onclick="openTaskModal()">＋ 과제 추가</button>`:''}</div><div class="task-date-heading">날짜별 과제 기록</div><input class="task-date-picker" type="date" value="${d}" onchange="state.studentTaskDate=this.value;render()"><div class="task-list">${list.map(t=>`<div class="compact-task"><div class="task-detail"><span class="tag">${esc(t.date)} · ${esc(t.source)} · ${esc(t.subject)}</span><div class="task-text">${esc(t.detail)}</div></div><div class="task-controls">${state.role==='student'&&d===today()?`<label class="inline-check"><input class="check" type="checkbox" ${t.studentDone?'checked':''} onchange="taskDone('${t.id}',this.checked)"> 완료</label>`:`<span class="pill">학생 ${t.studentDone?'완료':'미완료'}</span>`}<span class="pill">${esc(t.staffStatus)}</span></div></div>`).join('')||'<p class="small muted">등록된 과제가 없습니다.</p>'}</div></div>${state.role==='student'&&state.modal==='task'?`<div class="modal-backdrop" onclick="closeModal(event)"><section class="dialog" role="dialog" aria-modal="true"><div class="dialog-head"><h2>오늘 과제 추가</h2><button class="ghost closebtn" onclick="dismissModal()">✕</button></div><div class="dialog-body"><div class="split"><div><label>구분</label><select id="ts"><option>학교</option><option>학원</option></select></div><div><label>과목</label><input id="tc" placeholder="예: 수학"></div></div><label>과제 내용</label><input id="td" placeholder="예: 교재 20~25쪽"><button class="fullbtn" onclick="addTask()">과제 등록</button></div></section></div>`:''}`;
}
function openTaskModal(){state.modal='task';render()}
function taskDone(id,v){let t=db.tasks[state.id].find(t=>t.id===id);t.studentDone=v;save();render()}
function addTask(){let source=$('ts').value,subject=$('tc').value.trim(),detail=$('td').value.trim();if(!subject||!detail)return alert('과목과 과제 내용을 입력해 주세요.');(db.tasks[state.id]??=[]).push({id:uid(),date:today(),createdAt:Date.now(),source,subject,detail,studentDone:false,staffStatus:'대기'});state.modal=null;save();render()}
function staffCheck(sid,tid,status){let t=db.tasks[sid].find(t=>t.id===tid);t.staffStatus=status;save();render()}
function setInspectFilter(value){state.inspectFilter=value;state.expandedStudent='';render()}
function setInspectSearch(value){state.inspectSearch=value;updateInspectionList()}
function toggleInspectStudent(id){state.expandedStudent=state.expandedStudent===id?'':id;render()}
function updateInspectionList(){const list=document.getElementById('inspection-list');if(!list)return;const q=(state.inspectSearch||'').trim().toLowerCase();list.querySelectorAll('[data-student-name]').forEach(el=>{el.hidden=!!q&&!el.dataset.studentName.toLowerCase().includes(q)});const empty=document.getElementById('inspection-search-empty');if(empty)empty.hidden=[...list.querySelectorAll('[data-student-name]')].some(el=>!el.hidden)}
function inspection(){
 const d=state.taskDate;
 let groups=db.students.map(s=>({s,items:(db.tasks[s.id]||[]).filter(t=>t.date===d)})).filter(g=>g.items.length);
 groups.forEach(g=>{g.pending=g.items.some(t=>t.staffStatus==='대기');g.latest=Math.max(...g.items.map(t=>t.createdAt||0))});
 groups.sort((a,b)=>Number(b.pending)-Number(a.pending)||b.latest-a.latest);
 const pending=groups.filter(g=>g.pending).length;
 const f=state.inspectFilter||'pending';
 const visible=groups.filter(g=>f==='all'||(f==='pending'?g.pending:!g.pending));
 return `<div class="panel"><h2>오늘의 과제 검사</h2><div class="datebar" style="justify-content:flex-end"><input type="date" value="${d}" onchange="state.taskDate=this.value;state.expandedStudent='';render()"></div><div class="statbar"><span class="status">검사 대기 ${pending}명</span><span class="status">검사 완료 ${groups.length-pending}명</span></div><div class="inspect-toolbar"><button class="filter-btn ${f==='pending'?'selected':''}" onclick="setInspectFilter('pending')">검사 대기</button><button class="filter-btn ${f==='done'?'selected':''}" onclick="setInspectFilter('done')">검사 완료</button><button class="filter-btn ${f==='all'?'selected':''}" onclick="setInspectFilter('all')">전체</button></div><label for="inspect-search">학생 이름 검색</label><input id="inspect-search" placeholder="이름 검색" value="${esc(state.inspectSearch)}" oninput="setInspectSearch(this.value)"><div id="inspection-list">${visible.map(g=>`<div class="staff-student ${g.pending?'':'done'}" data-student-name="${esc(g.s.name)}"><button class="student-toggle" onclick="toggleInspectStudent('${g.s.id}')" aria-expanded="${state.expandedStudent===g.s.id}"><span><span class="name">${esc(g.s.name)}</span> <span class="tag">${esc(g.s.school)} · ${esc(g.s.grade)}학년</span><span class="student-summary">과제 ${g.items.length}개 · ${g.items.filter(t=>t.staffStatus!=='대기').length}개 검사 · ${new Date(g.latest).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} 입력</span></span><span class="rightpart"><span class="pill">${g.pending?'검사 대기':'검사 완료'}</span><span aria-hidden="true">${state.expandedStudent===g.s.id?'▲':'▼'}</span></span></button>${state.expandedStudent===g.s.id?`<div class="staff-student-body">${g.items.map(t=>`<div class="staff-task"><div class="staff-task-text"><span class="tag">${esc(t.source)} · ${esc(t.subject)} · 학생 ${t.studentDone?'완료':'미완료'}</span><div>${esc(t.detail)}</div></div><div class="staff-task-actions"><button class="inlinebtn ${t.staffStatus==='완료 확인'?'':'secondary'}" onclick="staffCheck('${g.s.id}','${t.id}','완료 확인')">완료</button><button class="inlinebtn ${t.staffStatus==='미완료 확인'?'':'secondary'}" onclick="staffCheck('${g.s.id}','${t.id}','미완료 확인')">미완료</button></div></div>`).join('')}</div>`:''}</div>`).join('')||'<p class="small muted">이 구분에 해당하는 학생이 없습니다.</p>'}<p id="inspection-search-empty" class="small muted" hidden>검색 결과가 없습니다.</p></div></div>`;
}

function requests(){return `<div class="panel"><h2>학부모 요청사항</h2><div class="notice"><b>안내</b><br>TES 관리형은 학생의 자기주도학습 습관 형성을 목표로 합니다. 지나친 간섭이나 잦은 계획 변경은 학습 의욕을 떨어뜨릴 수 있으므로, 요청사항은 학생과 상의 후 필요한 부분만 반영합니다.</div>${(db.requests[state.id]||[]).slice().reverse().map(r=>`<div class="item"><span class="tag">${r.date} · ${esc(r.subject)} · ${esc(r.type)}</span><p>${esc(r.note)}</p><span class="pill">${esc(r.status)}</span>${state.role==='staff'?`<div class="row" style="margin-top:9px"><button onclick="reqStatus('${r.id}','반영')">반영</button><button class="secondary" onclick="reqStatus('${r.id}','미반영')">미반영</button></div>`:''}</div>`).join('')}${state.role==='parent'?`<h3>요청 등록</h3><div class="request-form-grid"><div><label>과목</label><select id="rs"><option>국어</option><option>영어</option><option>수학</option><option>사회</option><option>과학</option><option>기타</option></select></div><div><label>요청 유형</label><select id="rt"><option>복습 확인</option><option>숙제 확인</option><option>학습계획 반영</option><option>기타</option></select></div></div><label>요청 내용 (100자 이내)</label><textarea maxlength="100" id="rn" placeholder="핵심 요청을 간단히 입력해 주세요."></textarea><button onclick="addRequest()">요청 등록</button>`:''}</div>`}
function addRequest(){let note=$('rn').value.trim();if(!note)return;(db.requests[state.id]??=[]).push({id:uid(),date:today(),subject:$('rs').value,type:$('rt').value,note,status:'접수'});save();render()}
function reqStatus(id,status){db.requests[state.id].find(r=>r.id===id).status=status;save();render()}
function filteredRegistry(){
 const q=(state.registrySearch||'').trim().toLowerCase();
 const f=state.registryFilter||'active';
 return db.students.filter(s=>(f==='all'||studentStatus(s)===f)&&[s.name,s.school,s.grade].some(v=>String(v||'').toLowerCase().includes(q))).sort((a,b)=>state.registrySort==='new'?(b.registeredAt||0)-(a.registeredAt||0):state.registrySort==='end'?(a.end||'').localeCompare(b.end||''):a.name.localeCompare(b.name,'ko'));
}
function registry(){
 const counts={active:0,expired:0,stopped:0,all:db.students.length};db.students.forEach(s=>counts[studentStatus(s)]++);
 return `<div class="panel"><h2>신규 학생 등록</h2><p class="small muted">학생 기본정보와 이용 기간을 입력하면 접속번호 6자리가 자동 발급됩니다.</p><div class="registry-form-grid"><div><label>학생 이름</label><input id="name"></div><div><label>학교</label><input id="school"></div><div><label>학년</label><input id="grade" placeholder="예: 2"></div><div><label>학생별 접속번호</label><input value="등록 시 자동 생성" readonly></div></div><label>관리형 상품</label><input id="product" placeholder="예: 일반 몰입석 관리형"><div class="registry-form-grid"><div><label>시작일</label><input type="date" id="start" value="${today()}"></div><div><label>종료일</label><input type="date" id="end" value="${addDays(today(),27)}"></div></div><button onclick="addStudent()">학생 등록</button></div>
 <div class="panel"><h2>등록 학생 · ${db.students.length}명</h2><div class="registry-toolbar">${[['active','이용 중'],['expired','기간 종료'],['stopped','이용 중단'],['all','전체']].map(([v,l])=>`<button class="${state.registryFilter===v?'':'secondary'}" onclick="state.registryFilter='${v}';state.expandedRegistry='';render()">${l} ${counts[v]}</button>`).join('')}</div><label>학생 검색</label><input id="registrySearch" value="${esc(state.registrySearch)}" placeholder="이름 · 학교 검색" oninput="state.registrySearch=this.value;updateRegistryList()"><select class="registry-sort" onchange="state.registrySort=this.value;updateRegistryList()"><option value="name" ${state.registrySort==='name'?'selected':''}>이름 가나다순</option><option value="new" ${state.registrySort==='new'?'selected':''}>최근 등록순</option><option value="end" ${state.registrySort==='end'?'selected':''}>종료일 빠른순</option></select><div id="registryList">${registryRows(filteredRegistry())}</div></div>`;
}
function registryRows(rows){return rows.map(s=>`<div class="registry-entry"><button class="registry-line" onclick="state.expandedRegistry=state.expandedRegistry==='${s.id}'?'':'${s.id}';updateRegistryList()"><b>${esc(s.name)}</b><span class="registry-school">${esc(s.school)} ${esc(s.grade)}학년</span><span class="registry-code">${esc(s.accessCode||'미발급')}</span><span class="registry-date">${esc(s.end?.slice(5)||'')}</span><span class="registry-chevron">${state.expandedRegistry===s.id?'▲':'▼'}</span></button>${state.expandedRegistry===s.id?`<div class="registry-detail"><div class="small muted">${esc(s.product)} · ${esc(s.start)} ~ ${esc(s.end)} · ${{active:'이용 중',expired:'기간 종료',stopped:'이용 중단'}[studentStatus(s)]}</div><div class="row" style="margin-top:8px"><button class="secondary inlinebtn" onclick="resetCode('${s.id}')">접속번호 재발급</button><input type="date" id="extend-${s.id}" value="${esc(s.end)}"><button class="secondary inlinebtn" onclick="extend('${s.id}')">기간 변경</button></div><div class="row" style="margin-top:8px"><button class="secondary inlinebtn" onclick="setStudentStopped('${s.id}',${s.status==='stopped'?'false':'true'})">${s.status==='stopped'?'이용 중단 해제':'이용 중단 지정'}</button></div></div>`:''}</div>`).join('')||'<p class="small muted">검색 결과가 없습니다.</p>'}
function updateRegistryList(){const input=$('registrySearch');if(input)state.registrySearch=input.value;const list=$('registryList');if(list)list.innerHTML=registryRows(filteredRegistry())}
function setStudentStopped(id,stopped){const s=db.students.find(s=>s.id===id);if(!s)return;s.status=stopped?'stopped':'';save();state.expandedRegistry='';render()}
function addStudent(){let name=$('name').value.trim(),school=$('school').value.trim(),grade=$('grade').value.trim();let start=$('start').value,end=$('end').value;if(!name||!school||!grade||!start||!end||end<start)return alert('학생 정보와 이용 기간을 확인해 주세요.');let id=uid(),accessCode=newCode();db.students.push({id,name,school,grade,accessCode,product:$('product').value,start,end,registeredAt:Date.now(),status:''});db.plans[id]=[];db.tasks[id]=[];db.requests[id]=[];db.reviews[id]=[];state.id=id;save();render();alert('학생 등록 완료. 발급된 접속번호: '+accessCode+'\n학생과 학부모에게 별도로 전달해 주세요.')}
function resetCode(id){if(!confirm('접속번호를 새로 발급할까요? 이전 번호는 사용할 수 없습니다.'))return;const s=db.students.find(s=>s.id===id);s.accessCode=newCode();save();render();alert(s.name+' 학생의 새 접속번호: '+s.accessCode+'\n학생과 학부모에게 별도로 전달해 주세요.')}
function extend(id){let end=$('extend-'+id).value;if(!end)return alert('종료일을 선택해 주세요.');let s=db.students.find(s=>s.id===id);if(end<s.start)return alert('시작일 이후로 설정해 주세요.');s.end=end;s.status='';save();render();alert('이용 기간이 변경되었습니다. (시연용)')}
function securityPanel(){
 if(!state.securityVerified)return `<div class="panel"><div class="top"><h2>🔐 보안 관리자</h2><button class="ghost" onclick="state.tab='inspection';render()">돌아가기</button></div><label>보안 관리자 비밀번호 (6자리)</label><input id="ownerOtp" type="password" inputmode="numeric" maxlength="6" placeholder="6자리 숫자" onkeydown="if(event.key==='Enter')verifyOwner()"><button class="fullbtn" onclick="verifyOwner()">접속하기</button><p id="securityError" class="error small"></p></div>`;
 return `<div class="panel"><div class="top"><h2>🔐 보안 관리자</h2><button class="ghost" onclick="lockSecurity()">나가기</button></div><h3>스태프 관리자 비밀번호 변경</h3><label>새 비밀번호 (숫자 4자리)</label><input id="newStaffPin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="4자리"><label>새 비밀번호 확인</label><input id="confirmStaffPin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="4자리 확인"><button class="fullbtn" onclick="changeStaffPin()">관리자 비밀번호 변경</button><p id="securityError" class="error small"></p></div>`;
}
function verifyOwner(){if(($('ownerOtp')?.value||'')!==securityPin){$('securityError').textContent='보안 관리자 비밀번호를 확인해 주세요.';return;}state.securityVerified=true;render()}
function lockSecurity(){state.securityVerified=false;state.tab='inspection';render()}
function changeStaffPin(){let a=$('newStaffPin').value,b=$('confirmStaffPin').value;if(!/^\d{4}$/.test(a)){$('securityError').textContent='숫자 4자리로 설정해 주세요.';return}if(a!==b){$('securityError').textContent='비밀번호가 일치하지 않습니다.';return}staffPin=a;localStorage.setItem('tes-study-staff-pin-demo',a);$('newStaffPin').value='';$('confirmStaffPin').value='';$('securityError').className='success small';$('securityError').textContent='관리자 비밀번호가 변경되었습니다.'}
function render(){if(!state.role)return gate();if(!state.auth)return login();if(state.role!=='staff'&&(!state.id||!eligible().some(s=>s.id===state.id))){state.id=eligible()[0]?.id||'';if(!state.id){back();return;}}if(state.role!=='staff'&&!isActive(student()))return sethtml(header()+expiry());let nav=state.role==='student'?[['plan','학습플래너'],['tasks','오늘 과제']]:state.role==='parent'?[['plan','학습플래너'],['tasks','과제 확인'],['requests','요청사항']]:[['inspection','과제 관리'],['plan','플래너 관리'],['requests','학부모 요청'],['registry','학생 관리']];if(state.tab!=='security'&&!nav.some(([id])=>id===state.tab))state.tab=nav[0][0];let content;if(state.role==='staff'){if(state.tab==='security')content=securityPanel();else if(state.tab==='inspection')content=inspection();else if(state.tab==='registry')content=registry();else {content=`<div class="panel"><label>학생 선택</label><select onchange="state.id=this.value;state.fridayEdit=null;render()">${db.students.map(s=>`<option value="${s.id}" ${s.id===state.id?'selected':''}>${esc(s.name)} · ${esc(s.school)}</option>`).join('')}</select></div>`+(state.tab==='plan'?calendar():requests())}}else content=state.tab==='plan'?calendar():state.tab==='tasks'?tasks():requests();sethtml(header()+tabs(nav)+content+(state.role==='staff'?`<div class="right" style="margin:24px 0 12px"><button class="ghost" style="font-size:12px" onclick="state.tab='security';state.securityVerified=false;render()">🔐 보안 관리자 ›</button></div>`:'')+'');if(state.role==='staff'&&state.tab==='inspection')updateInspectionList()}
render();
</script></body></html>
